name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cron is UTC; Kazakhstan is UTC+5 year-round (no DST), so subtract 5 to
  # read these as Almaty local time. Concentrated on the window that
  # matters for KASE's USDKZT_TOM weighted average rather than spread
  # evenly through the day.
  #
  # One run fetches all three sources, so the National Bank's daily gold
  # price is refreshed by these too — it needs no cron of its own.
  schedule:
    # Every 15 min, 12:00-15:45 Almaty, weekdays: the window where the
    # weighted average is actively forming. The tail end also captures the
    # 15:30 fixing itself (10:30 UTC) — the value the National Bank adopts
    # as the official rate.
    - cron: "*/15 7-10 * * 1-5"
    # One morning run (09:00 Almaty) so the new day's National Bank price
    # and an early KASE reading are live before that window opens —
    # otherwise a morning visitor would still see yesterday's afternoon.
    - cron: "0 4 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Collects data from sources a browser can't reach cross-origin. Never
      # fails the deploy: the script records per-source errors in its JSON
      # output and exits 0, so a source being down degrades that one card on
      # the page instead of blocking the whole site from shipping.
      #
      # The National Bank's own page publishes several recent days' gold
      # prices in one table, so a single fetch captures full history —
      # there's no longer any need to accumulate one day at a time by
      # committing state back to the repo across separate runs (the
      # earlier approach here, since removed: it needed contents: write,
      # a bot commit per run, and "[skip ci]" to avoid retrigger loops).
      - name: Fetch market data
        run: node scripts/fetch-market-data.mjs
      - run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
