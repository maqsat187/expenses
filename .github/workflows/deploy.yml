name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # No schedule: market data (and the "Прогноз" button's numbers) only
  # refresh on a push to main or a manual run of this workflow, not on a
  # timer. The Gold Coin page always shows its data's collection time, so
  # staleness is visible rather than silently assumed away.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Collects data from sources a browser can't reach cross-origin. Never
      # fails the deploy: the script records per-source errors in its JSON
      # output and exits 0, so a source being down degrades that one card on
      # the page instead of blocking the whole site from shipping.
      #
      # The National Bank's own page publishes several recent days' gold
      # prices in one table, so a single fetch captures full history —
      # there's no longer any need to accumulate one day at a time by
      # committing state back to the repo across separate runs (the
      # earlier approach here, since removed: it needed contents: write,
      # a bot commit per run, and "[skip ci]" to avoid retrigger loops).
      - name: Fetch market data
        run: node scripts/fetch-market-data.mjs
      - run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
